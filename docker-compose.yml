# ============================================================
# Agent Watch - Docker Compose 一键部署
#
# 用法:
#   docker-compose up -d              # 启动 Gateway（含 Dashboard 静态资源）
#   docker-compose up -d --build      # 重新构建并启动
#   docker-compose logs -f gateway    # 查看 gateway 日志
#   docker-compose down               # 停止所有服务
#
# 说明：
#   - Gateway 镜像内同时打包了 packages/dashboard/out/ 静态产物
#     访问 http://localhost:3000/dashboard 即可打开管理后台
#   - 不需要单独的 dashboard 服务、redis 服务、postgres 服务
#   - Gateway 使用 JSON 文件持久化（gateway-state.json）挂载到 gateway_data volume
# ============================================================

version: '3.8'

services:
  # ==========================================================
  # Gateway - API + WebSocket + 推送服务 + 静态托管 Dashboard
  # ==========================================================
  gateway:
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
    container_name: agent-watch-gateway
    ports:
      - '${GATEWAY_PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      # CORS
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      # 数据持久化目录（gateway-state.json 落盘位置）
      - DATA_DIR=/app/data
      # JWT（强制 32+ 字符，建议 `openssl rand -hex 32`）
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required in production. Run: openssl rand -hex 32}
      - JWT_ACCESS_TTL=${JWT_ACCESS_TTL:-900}
      - JWT_REFRESH_TTL=${JWT_REFRESH_TTL:-2592000}
      # 飞书（唯一推送通道）
      - FEISHU_ENABLED=${FEISHU_ENABLED:-false}
      - FEISHU_APP_ID=${FEISHU_APP_ID:-}
      - FEISHU_APP_SECRET=${FEISHU_APP_SECRET:-}
      - FEISHU_VERIFICATION_TOKEN=${FEISHU_VERIFICATION_TOKEN:-}
      - FEISHU_ENCRYPT_KEY=${FEISHU_ENCRYPT_KEY:-}
      - FEISHU_API_BASE_URL=${FEISHU_API_BASE_URL:-https://open.feishu.cn/open-apis}
      - FEISHU_USER_OPEN_ID_MAP=${FEISHU_USER_OPEN_ID_MAP:-{}}
      # 公网 URL
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - LOCAL_USER_NAME=${LOCAL_USER_NAME:-local-user}
      # 公网访问密码（PUBLIC_URL 非 localhost 时必填）
      - ACCESS_PASSWORD=${ACCESS_PASSWORD:-}
      # Dashboard（静态产物已在镜像内，DASHBOARD_DIR 由 Dockerfile 默认指定）
      - DASHBOARD_ENABLED=${DASHBOARD_ENABLED:-true}
      # Rate Limit
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW:-60000}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      # Approval
      - APPROVAL_TIMEOUT=${APPROVAL_TIMEOUT:-300}
      # 信任反向代理（nginx/cloudflare），让 req.ip 取真实客户端 IP
      - TRUST_PROXY=${TRUST_PROXY:-1}
    volumes:
      - gateway_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - agent-watch

networks:
  agent-watch:
    driver: bridge

volumes:
  gateway_data:
    driver: local
